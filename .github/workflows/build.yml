name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt "pyinstaller>=6,<7"
      - run: python build_tools/make_icon.py
      - run: python build_tools/make_version_info.py
      - run: python -m PyInstaller whisper-stt-devexus.spec
      - run: .\dist\whisper-stt-devexus\whisper-stt-devexus.exe --version
      - name: Zip
        run: Compress-Archive -Path dist\whisper-stt-devexus -DestinationPath whisper-stt-devexus-windows-x64-cpu.zip
      - uses: actions/upload-artifact@v4
        with:
          name: whisper-stt-devexus-windows-x64-cpu
          path: whisper-stt-devexus-windows-x64-cpu.zip
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: whisper-stt-devexus-windows-x64-cpu.zip
